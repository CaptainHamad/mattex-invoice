<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

rel="stylesheet">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:"Inter",Arial,sans-serif;
    background:#f6f7f9;
    color:#202020;
}

/* =========================
   HEADER
========================= */

.header{
    height:72px;
    background:#fff;
    border-bottom:1px solid #eee;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 45px;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    height:42px;
}

.nav{
    display:flex;
    align-items:center;
    gap:30px;
}

.nav a{
    text-decoration:none;
    color:#333;
    font-size:13px;
    font-weight:600;
}

.nav a:hover{
    color:#f7941d;
}

.header-btn{
    background:#f7941d;
    color:#fff !important;
    padding:11px 18px;
    border-radius:6px;
}

/* =========================
   HERO
========================= */

.hero{
    min-height:430px;
    background:
    linear-gradient(
        rgba(0,0,0,.62),
        rgba(0,0,0,.58)
    ),
    url("https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?q=80&w=1800&auto=format&fit=crop");

    background-size:cover;
    background-position:center;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:60px 20px;
}

.hero-content{
    width:100%;
    max-width:1000px;
    text-align:center;
    color:#fff;
}

.hero-content h1{
    font-size:48px;
    margin:0;
    font-weight:800;
    letter-spacing:-1px;
}

.hero-content p{
    margin:15px 0 30px;
    font-size:16px;
    opacity:.9;
}

/* SEARCH */

.search-box{
    background:#fff;
    padding:10px;
    border-radius:10px;

    display:grid;
    grid-template-columns:
    1fr 1fr 1fr 1fr auto;

    gap:8px;

    box-shadow:
    0 15px 40px rgba(0,0,0,.25);
}

.search-box select,
.search-box input{
    border:1px solid #ddd;
    height:48px;
    padding:0 13px;
    border-radius:6px;
    outline:none;
    font-family:inherit;
    font-size:13px;
}

.search-box select:focus,
.search-box input:focus{
    border-color:#f7941d;
}

.search-btn{
    height:48px;
    padding:0 24px;
    border:0;
    border-radius:6px;
    background:#f7941d;
    color:white;
    font-weight:700;
    cursor:pointer;
}

.search-btn:hover{
    background:#e9840d;
}

/* =========================
   MAIN
========================= */

.main{
    max-width:1400px;
    margin:auto;
    padding:55px 35px;
}

.section-header{
    display:flex;
    justify-content:space-between;
    align-items:end;
    margin-bottom:25px;
}

.section-title h2{
    margin:0;
    font-size:28px;
    font-weight:800;
}

.section-title p{
    margin:7px 0 0;
    color:#777;
    font-size:13px;
}

.result-count{
    color:#777;
    font-size:13px;
}

/* =========================
   VEHICLES GRID
========================= */

.vehicle-grid{
    display:grid;
    grid-template-columns:
    repeat(4,1fr);

    gap:18px;
}

/* CARD */

.vehicle-card{
    background:#fff;
    border-radius:10px;
    overflow:hidden;

    border:1px solid #eee;

    transition:
    transform .25s ease,
    box-shadow .25s ease;

    cursor:pointer;
}

.vehicle-card:hover{
    transform:translateY(-4px);

    box-shadow:
    0 12px 30px rgba(0,0,0,.10);
}

/* IMAGE */

.vehicle-image{
    height:205px;
    position:relative;
    overflow:hidden;
    background:#eee;
}

.vehicle-image img{
    width:100%;
    height:100%;
    object-fit:cover;

    transition:
    transform .4s ease;
}

.vehicle-card:hover
.vehicle-image img{
    transform:scale(1.04);
}

/* BADGES */

.badge{
    position:absolute;
    top:12px;
    left:12px;

    background:#f7941d;
    color:white;

    padding:5px 9px;

    border-radius:4px;

    font-size:9px;
    font-weight:800;

    z-index:2;
}

.badge.new{
    background:#159447;
}

.badge.featured{
    background:#222;
}

/* FAVORITE */

.favorite{
    position:absolute;
    top:10px;
    right:10px;

    width:34px;
    height:34px;

    border:0;
    border-radius:50%;

    background:#fff;

    box-shadow:
    0 3px 10px rgba(0,0,0,.15);

    cursor:pointer;

    z-index:3;
}

.favorite:hover{
    color:#f7941d;
}

/* BODY */

.vehicle-body{
    padding:15px;
}

.vehicle-name-row{
    display:flex;
    justify-content:space-between;
    align-items:start;
    gap:10px;
}

.vehicle-name{
    font-size:16px;
    font-weight:700;
    margin:0;
}

.vehicle-year{
    background:#f4f4f4;
    padding:4px 7px;
    border-radius:4px;
    font-size:10px;
    font-weight:700;
    color:#666;
}

/* SPECS */

.specs{
    display:grid;
    grid-template-columns:1fr 1fr;

    gap:8px;

    margin:14px 0;

    padding-bottom:14px;

    border-bottom:1px solid #eee;
}

.spec{
    color:#666;
    font-size:10px;
}

.spec i{
    color:#f7941d;
    width:15px;
}

/* PRICE */

.price-label{
    color:#888;
    font-size:9px;
}

.price{
    color:#f7941d;
    font-size:18px;
    font-weight:800;

    margin-top:2px;
}

/* BUTTONS */

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;

    gap:7px;

    margin-top:13px;
}

.action-btn{
    height:35px;

    display:flex;
    justify-content:center;
    align-items:center;

    border-radius:5px;

    text-decoration:none;

    font-size:10px;
    font-weight:700;

    cursor:pointer;
}

.details-btn{
    border:1px solid #ddd;
    color:#333;
    background:#fff;
}

.whatsapp-btn{
    border:1px solid #25D366;
    background:#25D366;
    color:white;
}

.whatsapp-btn:hover{
    background:#1fba59;
}

/* =========================
   MODAL
========================= */

.modal{
    position:fixed;
    inset:0;

    background:rgba(0,0,0,.65);

    display:none;

    justify-content:center;
    align-items:center;

    padding:20px;

    z-index:1000;
}

.modal.active{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:950px;

    max-height:90vh;

    overflow:auto;

    background:#fff;

    border-radius:12px;

    position:relative;
}

.modal-close{
    position:absolute;

    right:15px;
    top:15px;

    width:38px;
    height:38px;

    border:0;
    border-radius:50%;

    background:#fff;

    box-shadow:
    0 3px 12px rgba(0,0,0,.2);

    cursor:pointer;

    z-index:5;
}

.modal-content{
    display:grid;
    grid-template-columns:1fr 1fr;
}

.modal-image{
    min-height:450px;
}

.modal-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.modal-info{
    padding:40px;
}

.modal-info h2{
    margin:0;
    font-size:30px;
}

.modal-info .modal-price{
    font-size:26px;
    color:#f7941d;
    font-weight:800;
    margin:15px 0 25px;
}

.modal-specs{
    display:grid;
    grid-template-columns:1fr 1fr;

    gap:15px;

    margin-bottom:30px;
}

.modal-spec{
    padding:13px;
    background:#f7f7f7;
    border-radius:7px;
}

.modal-spec small{
    display:block;
    color:#888;
    font-size:10px;
    margin-bottom:4px;
}

.modal-spec strong{
    font-size:13px;
}

.modal-whatsapp{
    width:100%;
    height:48px;

    background:#25D366;

    color:white;

    border:0;

    border-radius:7px;

    font-size:14px;
    font-weight:700;

    cursor:pointer;
}

/* =========================
   EMPTY
========================= */

.empty{
    grid-column:1/-1;

    text-align:center;

    padding:70px 20px;

    background:white;

    border-radius:10px;

    color:#777;
}

.empty i{
    font-size:40px;
    color:#ccc;
    margin-bottom:15px;
}

/* =========================
   FOOTER
========================= */

.footer{
    background:#171717;
    color:#aaa;
    text-align:center;
    padding:30px 20px;
    font-size:12px;
}

.footer strong{
    color:#fff;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:1150px){

    .vehicle-grid{
        grid-template-columns:
        repeat(3,1fr);
    }

}

@media(max-width:850px){

    .header{
        padding:0 20px;
    }

    .nav{
        display:none;
    }

    .hero-content h1{
        font-size:36px;
    }

    .search-box{
        grid-template-columns:
        1fr 1fr;
    }

    .search-btn{
        grid-column:1/-1;
    }

    .vehicle-grid{
        grid-template-columns:
        repeat(2,1fr);
    }

    .modal-content{
        grid-template-columns:1fr;
    }

    .modal-image{
        min-height:280px;
    }

}

@media(max-width:550px){

    .main{
        padding:40px 15px;
    }

    .hero{
        min-height:500px;
    }

    .hero-content h1{
        font-size:29px;
    }

    .search-box{
        grid-template-columns:1fr;
    }

    .search-btn{
        grid-column:auto;
    }

    .vehicle-grid{
        grid-template-columns:1fr;
    }

    .section-header{
        align-items:start;
        flex-direction:column;
        gap:8px;
    }

    .modal-info{
        padding:25px;
    }

}

</style>

</head>

<script>

/* =====================================

const vehicles = [

},

{

},

{
    id:7,
    make:"Nissan",
    model:"Juke",
    year:2020,
    body:"SUV",
    fuel:"Petrol",
    transmission:"Automatic",
    engine:"1500cc",
    mileage:"40,000 km",
    price:27500000,
    badge:"",

},

{

    model:"Alphard",
    year:2021,
    body:"Van",
    fuel:"Petrol",
    transmission:"Automatic",

}

];


/* =====================================
   FORMAT MONEY
===================================== */

function money(value){

    return Number(value)
        .toLocaleString("en-US");

}


/* =====================================
   RENDER VEHICLES
===================================== */

function renderVehicles(list){

    const grid =
        document.getElementById("vehicleGrid");

    const count =
        document.getElementById("resultCount");

    count.innerText =
        list.length +
        (list.length === 1
        ? " vehicle"
        : " vehicles");


    if(list.length === 0){

        grid.innerHTML = `

            <div class="empty">

                <i class="fa-solid fa-car"></i>

                <h3>
                    No vehicles found
                </h3>

                <p>
                    Try changing your search criteria.
                </p>

            </div>

        `;

        return;

    }


    grid.innerHTML =
        list.map(vehicle => `

        <div
            class="vehicle-card"
            onclick="openVehicle(${vehicle.id})">


            <div class="vehicle-image">

                ${
                    vehicle.badge
                    ?
                    `
                    <span
                        class="badge
                        ${
                            vehicle.badge === "NEW"
                            ? "new"
                            :
                            vehicle.badge === "FEATURED"
                            ? "featured"
                            : ""
                        }">

                        ${vehicle.badge}

                    </span>
                    `
                    :
                    ""
                }


                <button
                    class="favorite"
                    onclick="event.stopPropagation();toggleFavorite(this)">

                    ♡

                </button>


                <img
                    src="${vehicle.image}"
                    alt="${vehicle.make} ${vehicle.model}">

            </div>


            <div class="vehicle-body">


                <div class="vehicle-name-row">

                    <h3 class="vehicle-name">

                        ${vehicle.make}
                        ${vehicle.model}

                    </h3>


                    <span class="vehicle-year">

                        ${vehicle.year}

                    </span>

                </div>


                <div class="specs">

                    <div class="spec">

                        <i class="fa-solid fa-gas-pump"></i>

                        ${vehicle.fuel}

                    </div>


                    <div class="spec">

                        <i class="fa-solid fa-gears"></i>

                        ${vehicle.transmission}

                    </div>


                    <div class="spec">

                        <i class="fa-solid fa-engine"></i>

                        ${vehicle.engine}

                    </div>


                    <div class="spec">

                        <i class="fa-solid fa-road"></i>

                        ${vehicle.mileage}

                    </div>

                </div>


                <div>

                    <div class="price-label">

                        Starting from

                    </div>

                    <div class="price">

                        TZS
                        ${money(vehicle.price)}

                    </div>

                </div>


                <div class="actions">


                    <button
                        class="action-btn details-btn"
                        onclick="event.stopPropagation();openVehicle(${vehicle.id})">

                        View Details

                    </button>


                    <a
                        href="https://wa.me/255699446205?text=Hello%20Mattex%20Motors,%20I%20am%20interested%20in%20this%20${encodeURIComponent(vehicle.make + " " + vehicle.model)}"
                        target="_blank"
                        class="action-btn whatsapp-btn"
                        onclick="event.stopPropagation()">

                        <i class="fa-brands fa-whatsapp"></i>

                        WhatsApp

                    </a>

                </div>


            </div>

        </div>

    `).join("");

}


/* =====================================
   OPEN VEHICLE
===================================== */

function openVehicle(id){

    const vehicle =
        vehicles.find(v => v.id === id);

    if(!vehicle) return;


    document.getElementById("modalContent")
    .innerHTML = `

        <div class="modal-image">

            <img
                src="${vehicle.image}"
                alt="${vehicle.make} ${vehicle.model}">

        </div>


        <div class="modal-info">

            <h2>

                ${vehicle.make}
                ${vehicle.model}

            </h2>


            <div class="modal-price">

                TZS ${money(vehicle.price)}

            </div>


            <div class="modal-specs">


                <div class="modal-spec">

                    <small>
                        YEAR
                    </small>

                    <strong>
                        ${vehicle.year}
                    </strong>

                </div>


                <div class="modal-spec">

                    <small>
                        BODY TYPE
                    </small>

                    <strong>
                        ${vehicle.body}
                    </strong>

                </div>


                <div class="modal-spec">

                    <small>

/* =====================================
   SEARCH
===================================== */

function searchVehicles(){

    const make =
        document.getElementById("searchMake")
        .value
        .toLowerCase();

    const body =
        document.getElementById("searchBody")
        .value
        .toLowerCase();

const yearFrom =
    document.getElementById("searchYearFrom")
    .value;

const yearTo =
    document.getElementById("searchYearTo")
    .value;

    const model =
        document.getElementById("searchModel")
        .value
        .toLowerCase();


    const results =
        vehicles.filter(vehicle => {

            const matchesMake =
                !make ||
                vehicle.make.toLowerCase() === make;

            const matchesBody =
                !body ||
                vehicle.body.toLowerCase() === body;

           const matchesYearFrom =
    !yearFrom ||
    vehicle.year >= Number(yearFrom);

const matchesYearTo =
    !yearTo ||
    vehicle.year <= Number(yearTo);

            const matchesModel =
                !model ||
                vehicle.model.toLowerCase()
                .includes(model);


           return (
    matchesMake &&
    matchesBody &&
    matchesYearFrom &&
    matchesYearTo &&
    matchesModel
);

        });


    renderVehicles(results);


    document.getElementById("vehicles")
        .scrollIntoView({
            behavior:"smooth"
        });

}


/* =====================================
   INITIAL LOAD
===================================== */

renderVehicles(vehicles);

function updateToYearOptions(){

    const fromYear =
        document.getElementById("searchYearFrom").value;

    const toSelect =
        document.getElementById("searchYearTo");

    const currentValue =
        toSelect.value;

    toSelect.innerHTML = `
        <option value="">
            To Year
        </option>
    `;

    const maxYear = 2026;
    const minYear = 2001;

    // Kama From Year haijachaguliwa
    if(!fromYear){

        for(
            let year = maxYear;
            year >= minYear;
            year--
        ){

            toSelect.innerHTML += `
                <option value="${year}">
                    ${year}
                </option>
            `;

        }

        return;
    }

    // To Year ianze kwenye From Year
    for(
        let year = maxYear;
        year >= Number(fromYear);
        year--
    ){

        toSelect.innerHTML += `
            <option value="${year}">
                ${year}
            </option>
        `;

    }

    // Rudisha previous selection kama bado ni valid
    if(
        currentValue &&
        Number(currentValue) >= Number(fromYear)
    ){

        toSelect.value = currentValue;

    }

}
